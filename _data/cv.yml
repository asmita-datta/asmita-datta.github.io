    Experience:
      - company: Quantum Information and Matter Group
        position: Doctoral Researcher
        location: University of Padova
        start_date: 2023
        end_date: Present
        summary: ""
        highlights:
          - Benchmarked the performance of Quantum Fourier Transform (QFT) algorithm, characterising the propagation of errors and its scalability on a tensor-network based QC emulator (QMatcha TEA). 
          - Benchmarking Shor algorithm on QMatcha TEA using MPS and TTN simulations of its quantum circuit, comparing different performance metrics and parameters governing the overall quality and scalability of the simulations.

      - company: Indian Institute of Science Education and Research, Bhopal
        position: MS Thesis - Chanakya PG Fellow
        location: IISERB, India
        start_date: 2022
        end_date: 2023
        summary: Quantum Machine Learning for determining exchange-correlation potentials in many-body systems
        highlights:
          - Developed ANN and Quantum Neural Networks (QNN) models to map the HSE xc potential range separation parameter $\omega$ based on material properties for 40 semiconducting and insulating materials. Generated training databases using VASP calculations and extracted material features via pymatgen from the Materials Project.

      - company: Quantum Optics and Statistics Group, University of Freiburg, Germany
        position: DAAD WISE Scholar
        location: Freiburg, Germany
        start_date: May 2022
        end_date: July 2022
        summary: Modelling Quantum Networks using three level atomic systems
        highlights:
          - Modelled a quantum network with three nodes, each representing a three level atom, and studied the damage and reparation of the network by tuning parameters like transition rate, state preparation using pulses, and continuous wave driving frequency using Python and compared its resilience to an equivalent classical network

      - company: London Mathematical Laboratory Summer School
        position: Summer Intern
        location: Remote
        start_date: July 2021
        end_date: ""
        summary: Tackling Quantum many-body systems using Artificial Neural Networks
        highlights:
          - Studied the 1D Quantum Ising and Heisenberg models using a RBM ansatz and simulated their ground state energies, spin-spin correlation functions, and magnetization using NetKet.


